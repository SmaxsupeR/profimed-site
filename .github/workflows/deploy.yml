name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-root
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --legacy-peer-deps: @vitejs/plugin-react ещё не объявил поддержку
      # vite 8 в своём peerDependencies, хотя фактически с ним работает —
      # тот же обход нужен и при локальной установке.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      # Публикуем в корень ветки gh-pages. keep_files: true — иначе каждый
      # деплой стирал бы соседние превью (например /stage1/ из отдельного
      # workflow), т.к. по умолчанию action чистит всё, что не в publish_dir.
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
