name: Deploy stage3.12 preview to GitHub Pages

on:
  push:
    branches: [redesign/stage-3.12-doctors-about-privacy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-stage3.12
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Превью живёт в подпапке /stage3.12/ рядом с боевым сайтом и другими
      # превью на том же GitHub Pages — поэтому base переопределяем на
      # билде, а не храним в vite.config.js.
      - run: npm run build -- --base=/profimed-site/stage3.12/
      # destination_dir + keep_files: true — публикуем только в /stage3.12/
      # той же ветки gh-pages, не трогая корень и остальные превью.
      #
      # Раньше этот workflow был закоммичен прямо в ветку
      # redesign/stage-3.1-hero-art-direction и триггерился с неё же
      # (тот же push, что и deploy-stage3.1.yml) — оба деплоя срабатывали
      # одновременно на любой пуш в эту ветку и взаимно перезаписывали
      # друг другу папки на gh-pages. Теперь у этапа 3.12 своя ветка
      # (redesign/stage-3.12-doctors-about-privacy, восстановлена из
      # исходного коммита этого этапа) и свой триггер — как и у всех
      # остальных этапов.
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          destination_dir: stage3.12
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
